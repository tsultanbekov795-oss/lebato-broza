<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lebato Broza</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e1621; --sidebar: #17212b; --card: #182533; --border: #0e1621;
  --text: #f5f5f5; --muted: #6d7f8f; --primary: #3390ec; --primary-h: #2b7fd4;
  --bubble-out: #2b5278; --bubble-in: #182533; --hover: #202b36; --like: #e53935;
  --input-bg: #242f3d; --radius: 12px;
}
[data-theme="light"] {
  --bg: #fff; --sidebar: #f0f2f5; --card: #fff; --border: #e4e6eb;
  --text: #0f1419; --muted: #65676b; --bubble-out: #effdde; --bubble-in: #f0f2f5;
  --hover: #e4e6eb; --input-bg: #f0f2f5;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Roboto', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
.hidden { display: none !important; }

/* Animations */
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes scaleIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
@keyframes slideRight { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
@keyframes heartPop { 0% { transform: scale(1); } 30% { transform: scale(1.4); } 100% { transform: scale(1); } }
@keyframes spin { to { transform: rotate(360deg); } }

.app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; animation: fadeIn 0.4s ease; }
@media (max-width: 700px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .sidebar.mobile-open { display: flex; position: fixed; inset: 0; z-index: 100; animation: slideRight 0.25s ease; }
}

.sidebar { background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
.sidebar-header { padding: 12px 14px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); min-height: 56px; }
.logo-img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; flex-shrink: 0; transition: transform 0.3s; }
.logo-img:hover { transform: scale(1.08) rotate(-5deg); }
.logo-text { font-weight: 700; font-size: 1.05rem; }
.logo-sub { font-size: 0.72rem; color: var(--muted); }
.sidebar-search { padding: 8px 12px; position: relative; }
.sidebar-search input { width: 100%; background: var(--input-bg); border: none; border-radius: 22px; padding: 10px 16px; color: var(--text); font-size: 0.95rem; outline: none; transition: box-shadow 0.2s; }
.sidebar-search input:focus { box-shadow: 0 0 0 2px var(--primary); }
.nav-list { flex: 1; overflow-y: auto; padding: 6px 0; }
.nav-item { display: flex; align-items: center; gap: 14px; padding: 10px 16px; cursor: pointer; border: none; background: transparent; color: var(--text); width: 100%; text-align: left; font-size: 0.95rem; transition: background 0.15s, transform 0.15s; }
.nav-item:hover { background: var(--hover); }
.nav-item.active { background: var(--primary); color: #fff; }
.nav-item .icon { font-size: 1.35rem; width: 28px; text-align: center; transition: transform 0.2s; }
.nav-item:hover .icon { transform: scale(1.15); }
.sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.sidebar-footer img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
.sidebar-footer .name { font-weight: 500; font-size: 0.9rem; }
.sidebar-footer .act { margin-left: auto; display: flex; gap: 4px; }

.main { display: flex; flex-direction: column; height: 100vh; background: var(--bg); overflow: hidden; }
.main-header { min-height: 56px; padding: 0 16px; display: flex; align-items: center; gap: 12px; background: var(--sidebar); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.main-header h1 { font-size: 1rem; font-weight: 500; }
.main-header .sub { font-size: 0.8rem; color: var(--muted); }
.menu-btn { display: none; background: none; border: none; color: var(--text); font-size: 1.4rem; cursor: pointer; }
@media (max-width: 700px) { .menu-btn { display: block; } }
.content-scroll { flex: 1; overflow-y: auto; padding: 12px 0 80px; }

.compose { margin: 0 12px 12px; background: var(--card); border-radius: var(--radius); padding: 12px; border: 1px solid var(--border); animation: fadeUp 0.35s ease; }
.compose-top { display: flex; gap: 10px; align-items: flex-start; }
.compose-top textarea { flex: 1; background: transparent; border: none; color: var(--text); resize: none; outline: none; font-family: inherit; font-size: 0.95rem; min-height: 44px; padding-top: 8px; }
.compose-actions { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
.compose-actions .left { display: flex; gap: 2px; }
.icon-btn { background: transparent; border: none; font-size: 1.25rem; cursor: pointer; padding: 6px 8px; border-radius: 8px; color: var(--muted); transition: color 0.15s, background 0.15s, transform 0.15s; }
.icon-btn:hover { background: var(--hover); color: var(--primary); transform: scale(1.1); }
.send-btn { background: var(--primary); color: #fff; border: none; padding: 8px 18px; border-radius: 20px; font-weight: 500; cursor: pointer; font-size: 0.9rem; transition: background 0.15s, transform 0.15s; }
.send-btn:hover { background: var(--primary-h); transform: scale(1.03); }
.send-btn:active { transform: scale(0.97); }
.preview-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.preview-row img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; animation: scaleIn 0.25s ease; }
.stickers-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); animation: fadeIn 0.2s ease; }
.sticker-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; padding: 4px; border-radius: 6px; transition: transform 0.15s; }
.sticker-btn:hover { transform: scale(1.25); }

.post { margin: 0 12px 10px; background: var(--card); border-radius: var(--radius); padding: 14px 16px; border: 1px solid var(--border); animation: fadeUp 0.4s ease both; }
.post:nth-child(1) { animation-delay: 0.05s; }
.post:nth-child(2) { animation-delay: 0.1s; }
.post:nth-child(3) { animation-delay: 0.15s; }
.post:nth-child(4) { animation-delay: 0.2s; }
.post:nth-child(5) { animation-delay: 0.25s; }
.post-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.post-head img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; }
.post-head .author { font-weight: 500; font-size: 0.95rem; }
.post-head .time { color: var(--muted); font-size: 0.8rem; margin-left: auto; }
.post-body { font-size: 0.95rem; line-height: 1.45; white-space: pre-wrap; word-break: break-word; margin-bottom: 8px; }
.post-sticker { font-size: 3rem; margin: 4px 0; animation: scaleIn 0.3s ease; }
.post-imgs { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 4px; margin: 8px 0; border-radius: 10px; overflow: hidden; }
.post-imgs img { width: 100%; max-height: 280px; object-fit: cover; cursor: pointer; transition: transform 0.3s; }
.post-imgs img:hover { transform: scale(1.02); }
.post-bar { display: flex; gap: 4px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); }
.react-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 16px; font-size: 0.85rem; transition: background 0.15s, color 0.15s, transform 0.15s; }
.react-btn:hover { background: var(--hover); }
.react-btn.liked { color: var(--like); }
.react-btn.liked .heart { animation: heartPop 0.35s ease; }
.react-btn.reposted { color: var(--primary); }
.repost-label { font-size: 0.78rem; color: var(--primary); margin-bottom: 6px; }

.comments { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); animation: fadeIn 0.25s ease; }
.comment { display: flex; gap: 8px; margin-bottom: 8px; animation: fadeUp 0.3s ease; }
.comment img { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; }
.comment-bubble { background: var(--bubble-in); padding: 6px 12px; border-radius: 12px; border-top-left-radius: 4px; max-width: 90%; }
.comment-bubble .who { font-weight: 500; font-size: 0.8rem; color: var(--primary); }
.comment-bubble .txt { font-size: 0.9rem; }
.add-cmt { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
.add-cmt input { flex: 1; background: var(--input-bg); border: none; border-radius: 20px; padding: 8px 14px; color: var(--text); outline: none; font-size: 0.9rem; }
.add-cmt button { background: var(--primary); border: none; color: #fff; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; transition: transform 0.15s; }
.add-cmt button:hover { transform: scale(1.1); }

.stories { display: flex; gap: 12px; overflow-x: auto; padding: 8px 16px 12px; scrollbar-width: none; }
.stories::-webkit-scrollbar { display: none; }
.story-item { flex-shrink: 0; width: 64px; text-align: center; cursor: pointer; transition: transform 0.2s; animation: scaleIn 0.35s ease both; }
.story-item:hover { transform: scale(1.08); }
.story-item img { width: 56px; height: 56px; border-radius: 50%; border: 2.5px solid var(--primary); object-fit: cover; padding: 2px; background: var(--bg); }
.story-item span { display: block; font-size: 0.7rem; color: var(--muted); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.msg-layout { display: grid; grid-template-columns: 280px 1fr; height: calc(100vh - 56px); }
@media (max-width: 700px) { .msg-layout { grid-template-columns: 1fr; } }
.conv-list { border-right: 1px solid var(--border); overflow-y: auto; background: var(--sidebar); }
.conv-item { display: flex; gap: 12px; padding: 12px 14px; cursor: pointer; border-bottom: 1px solid var(--border); transition: background 0.15s; animation: slideRight 0.3s ease; }
.conv-item:hover, .conv-item.active { background: var(--hover); }
.conv-item img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
.conv-item .cname { font-weight: 500; font-size: 0.95rem; }
.conv-item .cprev { font-size: 0.82rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
.chat-pane { display: flex; flex-direction: column; background: var(--bg); background-image: radial-gradient(circle at 20% 50%, rgba(51,144,236,0.04) 0%, transparent 50%); }
.chat-head { padding: 12px 16px; background: var(--sidebar); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
.chat-msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.bubble { max-width: 70%; padding: 8px 12px; border-radius: 14px; font-size: 0.95rem; line-height: 1.4; animation: scaleIn 0.25s ease; }
.bubble.out { align-self: flex-end; background: var(--bubble-out); border-bottom-right-radius: 4px; color: #fff; }
[data-theme="light"] .bubble.out { color: var(--text); }
.bubble.in { align-self: flex-start; background: var(--card); border-bottom-left-radius: 4px; }
.chat-compose { padding: 10px 12px; background: var(--sidebar); border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
.chat-compose input { flex: 1; background: var(--input-bg); border: none; border-radius: 22px; padding: 10px 16px; color: var(--text); outline: none; }
.chat-placeholder { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 0.95rem; }

.profile-wrap { max-width: 420px; margin: 24px auto; text-align: center; padding: 24px; animation: fadeUp 0.4s ease; }
.profile-wrap img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary); transition: transform 0.3s; }
.profile-wrap img:hover { transform: scale(1.05); }
.profile-wrap h2 { margin: 14px 0 4px; font-weight: 500; }
.profile-wrap .bio { color: var(--muted); margin-bottom: 16px; }
.tg-btn { background: var(--primary); color: #fff; border: none; padding: 10px 24px; border-radius: 10px; font-weight: 500; cursor: pointer; font-size: 0.95rem; transition: background 0.15s, transform 0.15s; }
.tg-btn:hover { background: var(--primary-h); transform: scale(1.03); }
.tg-btn.secondary { background: var(--input-bg); color: var(--text); }

.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 16px; animation: fadeIn 0.2s ease; }
.modal-box { background: var(--sidebar); border-radius: 14px; padding: 20px; width: 100%; max-width: 360px; border: 1px solid var(--border); animation: scaleIn 0.25s ease; }
.modal-box h2 { font-size: 1.1rem; font-weight: 500; margin-bottom: 14px; }
.modal-box label { display: block; font-size: 0.8rem; color: var(--muted); margin: 10px 0 4px; }
.modal-box input, .modal-box textarea { width: 100%; background: var(--input-bg); border: none; border-radius: 10px; padding: 10px 12px; color: var(--text); font-family: inherit; }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; }
.img-modal-box { position: relative; max-width: 90vw; max-height: 90vh; animation: scaleIn 0.3s ease; }
.img-modal-box img { max-width: 100%; max-height: 85vh; border-radius: 10px; }
.close-x { position: absolute; top: -40px; right: 0; background: var(--sidebar); border: none; color: var(--text); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 1.1rem; }

.empty { text-align: center; padding: 60px 20px; color: var(--muted); animation: fadeIn 0.4s ease; }
.empty .big { font-size: 3rem; margin-bottom: 12px; animation: pulse 2s ease infinite; }
.search-drop { position: absolute; top: 100%; left: 12px; right: 12px; background: var(--sidebar); border: 1px solid var(--border); border-radius: 12px; max-height: 300px; overflow-y: auto; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,0.3); animation: fadeUp 0.2s ease; }
.search-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; cursor: pointer; transition: background 0.15s; }
.search-row:hover { background: var(--hover); }
.search-row img { width: 40px; height: 40px; border-radius: 50%; }
.loader { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--muted); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; }
.online-dot { width: 8px; height: 8px; background: #4caf50; border-radius: 50%; display: inline-block; animation: pulse 2s ease infinite; }
</style>
</head>
